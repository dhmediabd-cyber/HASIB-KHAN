        .floating-chat-btn {

            left: 25px;

            height: 55px;
            background-color: #388e3c;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            z-index: 999;
        }
        .floating-chat-btn svg {
            width: 28px;
            height: 28px;
            fill: #ffffff;
        }

        /* Print Button */
        .print-btn-container {

            cursor: pointer;

        .print-btn:hover {

            color: #2b2b2b;
            margin-bottom: 4px;
        }
        .footer-col a {
            font-size: 12px;
            color: #555555;
            text-decoration: none;
        }
        .footer-col a:hover {
            text-decoration: underline;
        }
        .social-icons {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }
        .social-icons a {
            color: #333;
            font-size: 12px;
        }
